[alembic]
script_location = migrations
prepend_sys_path = .

# URL được env.py đọc từ resources/application.yml (ưu tiên), rồi tới biến môi
# trường DATABASE_URL, cuối cùng mới tới placeholder dưới đây.
sqlalchemy.url = postgresql+asyncpg://localhost/shop

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
