# Shop Backend - Override cấu hình cho môi trường PRODUCTION.
# Kích hoạt bằng biến môi trường: XIME_ENV=production (hoặc APP_ENV=production).
# File này merge ĐÈ lên application.yml (deep merge), chỉ ghi các key khác với base.
# ⚠ File NÀY nằm trong git, nên không commit secret thật vào đây. Nhưng cũng ĐỪNG trỏ sang
# `application-secret.yml`: framework không có profile nào tên "secret" nên file đó không bao
# giờ được nạp - đó chính là phát hiện A6 của kiểm toán 2026-08-01, và là lý do secret thật
# chưa bao giờ rời khỏi git. Cách đúng: lúc deploy, ghi đè chính file này bằng bản có secret
# thật (mount/copy trên máy chủ) rồi chạy với XIME_ENV=production.

# Cookie refresh token cho ngữ cảnh CROSS-SITE thật (frontend khác domain với backend).
# samesite=none bắt buộc đi kèm secure=true, và secure yêu cầu backend chạy qua HTTPS.
# Trên dev (http localhost, same-site) giữ mặc định lax/secure=false ở application.yml.
cookie:
  secure: true
  samesite: "none"

# CORS - chỉ giữ origin prod của frontend (bỏ localhost dev).
# Đổi domain theo frontend thật khi deploy.
cors:
  allow_origins:
    - "https://shop.scime.click"
  # TẮT regex dev (không cho khớp localhost/IP LAN ở production - chỉ origin prod ở trên).
  # Disable the dev regex in production (only the explicit prod origin is allowed).
  allow_origin_regex: null

# Kho Xime Store: trên Linux đặt thẳng trên RAM. Nội dung MẤT khi máy khởi động lại - đúng ý
# với bộ đếm hãm nhịp (mất thì người đang bị khóa được thả sớm, không mất dữ liệu nghiệp vụ).
# systemd: dùng RuntimeDirectory=shop + RuntimeDirectoryPreserve=restart rồi trỏ vào /run/shop
# nếu muốn kho sống qua lần restart service.
# On Linux keep the store in RAM; contents are lost on reboot, which is fine for rate limits.
lmdb:
  path: "/dev/shm/shop-store"
