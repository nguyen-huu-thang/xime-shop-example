[project]
name = "shop-backend"
version = "0.1.0"
description = "Shop backend (PHP→Python migration) — bản tham chiếu/kiểm thử cho Xime framework"
requires-python = ">=3.12"

# Xime Framework được cài từ local path (editable):
#   pip install -e "D:\code\xime\xime framework"
# Sau đó cài dependencies của dự án:
#   pip install -e .
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pyjwt[crypto]>=2.8",
    "passlib[bcrypt]>=1.7",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["test"]
addopts = "--import-mode=importlib"
pythonpath = [".", "app"]
